<title>월급 주기 가계부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: 통장(passbook) 같은 한 줄 장부. 폰 한 칸 기준, 넓으면 가운데 760px 기둥 */
  :root {
    --paper: #eef3f0;
    --surface: #ffffff;
    --ink: #16231e;
    --muted: #5a6a63;
    --line: #d5e0da;
    --accent: #0d6b59;
    --accent-ink: #ffffff;
    --accent-soft: #dcefe9;
    --out: #c8323d;
    --in: #2457c9;
    --warn: #a35a00;
    --warn-soft: #fdf0dc;
    --c1: #0d6b59; --c2: #b44a1c; --c3: #5b4bc4; --c4: #a0306e; --c5: #2d6fa3; --c6: #7a6a12;
    --shadow: 0 6px 24px rgba(16, 40, 32, .14);
    --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e1513; --surface: #161f1c; --ink: #e2ebe7; --muted: #92a39b; --line: #2a3733;
      --accent: #4fc2a7; --accent-ink: #062019; --accent-soft: #173229;
      --out: #ff8087; --in: #86a9ff; --warn: #f2b25c; --warn-soft: #33270f;
      --c1: #4fc2a7; --c2: #f0956a; --c3: #a99cff; --c4: #f28bbd; --c5: #78b8ea; --c6: #d8c55e;
      --shadow: 0 6px 24px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e1513; --surface: #161f1c; --ink: #e2ebe7; --muted: #92a39b; --line: #2a3733;
    --accent: #4fc2a7; --accent-ink: #062019; --accent-soft: #173229;
    --out: #ff8087; --in: #86a9ff; --warn: #f2b25c; --warn-soft: #33270f;
    --c1: #4fc2a7; --c2: #f0956a; --c3: #a99cff; --c4: #f28bbd; --c5: #78b8ea; --c6: #d8c55e;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--f-body); font-size: 15px; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--surface);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .out { color: var(--out); }
  .in { color: var(--in); }
  .muted { color: var(--muted); }
  .small { font-size: .82rem; }

  /* 상단 */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top .wrap { display: flex; flex-direction: column; gap: .35rem; padding-block: .6rem 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
  .brand h1 { font-size: 1.05rem; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand h1 span { color: var(--accent); }
  .pill {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .74rem; padding: .12rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .pill::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--accent); border-color: currentColor; }
  .pill.warn { color: var(--warn); border-color: currentColor; }
  nav.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
  nav.tabs button {
    flex: 1 0 auto; border: 0; background: none; padding: .55rem .9rem .6rem;
    font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

  main.wrap { padding-block: 1rem 7rem; display: flex; flex-direction: column; gap: 1.1rem; }
  .banner {
    background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn);
    border-radius: .6rem; padding: .6rem .8rem; font-size: .86rem;
    display: flex; gap: .6rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }

  section.block { background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; min-width: 0; }
  .block > h2, .h2 { font-size: .8rem; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 .7rem; }
  .row-between { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; flex-wrap: wrap; }

  /* 홈 머리 */
  .today { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
  .today .date { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  .dday {
    font-family: var(--f-num); font-weight: 600; font-size: .9rem;
    background: var(--accent); color: var(--accent-ink); border-radius: .4rem; padding: .2rem .55rem;
  }
  .stats { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr); gap: .5rem; }
  .stat { border-left: 2px solid var(--line); padding-left: .6rem; min-width: 0; }
  .stat .k { font-size: .76rem; color: var(--muted); }
  .stat .v { font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
  .stat.big .v { font-size: 1.15rem; }

  /* 카드대금 묶음 */
  .cycle-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
  @media (max-width: 560px) { .cycle-pair { grid-template-columns: 1fr; } }
  .cyc { border: 1px solid var(--line); border-radius: .6rem; padding: .75rem; min-width: 0; }
  .cyc.now { border-color: var(--accent); background: var(--accent-soft); }
  .cyc .label { font-size: .8rem; color: var(--muted); }
  .cyc .sum { font-size: 1.35rem; font-weight: 600; margin: .1rem 0 .4rem; }
  .bill-line { display: grid; grid-template-columns: auto 1fr auto; gap: .5rem; align-items: center; padding: .3rem 0; border-top: 1px dashed var(--line); font-size: .88rem; }
  .bill-line .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: .6rem; height: .6rem; border-radius: 2px; display: inline-block; flex: none; }
  .chip {
    font-size: .7rem; padding: .05rem .4rem; border-radius: .3rem; white-space: nowrap;
    border: 1px solid currentColor; font-weight: 500;
  }
  .chip.done { color: var(--muted); }
  .chip.fixed { color: var(--accent); }
  .chip.open { color: var(--warn); }
  .net { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--line); font-size: .85rem; }

  /* 장부 목록 */
  .day { display: flex; flex-direction: column; }
  .day + .day { margin-top: .9rem; }
  .day-head { display: flex; justify-content: space-between; gap: .5rem; font-size: .8rem; color: var(--muted); padding-bottom: .25rem; border-bottom: 1px solid var(--ink); }
  .day-head b { color: var(--ink); font-weight: 700; }
  .entry {
    display: grid; grid-template-columns: 1fr auto; gap: .1rem .75rem; align-items: center;
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: .5rem .1rem;
  }
  .entry:hover { background: var(--accent-soft); }
  .entry .what { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .entry .meta { grid-column: 1; font-size: .76rem; color: var(--muted); display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .entry .amt { grid-row: 1 / span 2; grid-column: 2; font-weight: 600; text-align: right; }
  .empty { text-align: center; color: var(--muted); padding: 1.2rem .5rem; font-size: .9rem; }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .pager .title { text-align: center; font-weight: 700; }
  .pager .title small { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: .5rem; width: 2.4rem; height: 2.4rem; font-size: 1.1rem; flex: none; }

  .bars { display: flex; flex-direction: column; gap: .45rem; }
  .bar-row { display: grid; grid-template-columns: 5.5rem 1fr 6.5rem; gap: .5rem; align-items: center; font-size: .85rem; }
  .bar-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: .65rem; background: var(--paper); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-row .v { text-align: right; }

  /* 카드대금 탭 */
  .card-bill { border: 1px solid var(--line); border-radius: .6rem; overflow: hidden; }
  .card-bill + .card-bill { margin-top: .7rem; }
  .card-bill .hd { display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .6rem; align-items: center; padding: .7rem .8rem; }
  .card-bill .hd .nm { font-weight: 700; }
  .card-bill .hd .tot { font-size: 1.15rem; font-weight: 600; text-align: right; }
  .card-bill .hd .sub { grid-column: 2 / span 2; font-size: .78rem; color: var(--muted); }
  .card-bill .swatch { width: .35rem; align-self: stretch; border-radius: 2px; grid-row: 1 / span 2; }
  .card-bill details { border-top: 1px solid var(--line); }
  .card-bill summary { padding: .45rem .8rem; font-size: .82rem; color: var(--muted); cursor: pointer; }
  .items { padding: 0 .8rem .5rem; }
  .item { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: .5rem; font-size: .85rem; padding: .3rem 0; border-top: 1px dashed var(--line); }
  .item .ds { color: var(--muted); }
  .forecast { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .4rem; align-items: end; height: 9rem; }
  .fc { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; height: 100%; gap: .2rem; min-width: 0; border: 0; background: none; padding: 0; }
  .fc .stack { display: flex; flex-direction: column-reverse; border-radius: 3px 3px 0 0; overflow: hidden; min-height: 2px; background: var(--line); }
  .fc .stack span { display: block; }
  .fc .lb { font-size: .72rem; text-align: center; color: var(--muted); }
  .fc .vv { font-size: .68rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc[aria-pressed="true"] .lb { color: var(--ink); font-weight: 700; }
  .legend { display: flex; gap: .3rem .8rem; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-top: .6rem; }
  .legend span { display: inline-flex; gap: .3rem; align-items: center; }

  /* 버튼·폼 */
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: .5rem;
    padding: .5rem .9rem; font-weight: 500;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn.danger { color: var(--out); border-color: var(--out); }
  .btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: .3rem; }
  .btn-row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
  .field > span { font-size: .8rem; color: var(--muted); font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: .5rem;
    background: var(--surface); min-width: 0;
  }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .7rem; }
  @media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: .55rem; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: .55rem; font-weight: 700; color: var(--muted); }
  .seg button[aria-pressed="true"].o { background: var(--out); color: var(--surface); }
  .seg button[aria-pressed="true"].i { background: var(--in); color: var(--surface); }
  .amount-input { font-family: var(--f-num); font-size: 1.6rem !important; font-weight: 600; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .chips button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: .25rem .7rem; font-size: .84rem;
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .preview { font-size: .84rem; background: var(--accent-soft); border-radius: .5rem; padding: .5rem .65rem; }

  .card-row { display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .7rem; align-items: center; padding: .6rem 0; border-bottom: 1px solid var(--line); }
  .card-row .sub { grid-column: 2; font-size: .8rem; color: var(--muted); }

  .steps { display: grid; gap: .6rem; margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 1.7rem 1fr; gap: .5rem; align-items: start; counter-increment: s; }
  .steps li::before { content: counter(s); font-family: var(--f-num); font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: .35rem; text-align: center; line-height: 1.7rem; }

  /* 기록 버튼, 시트 */
  .fab {
    position: fixed; z-index: 6;
    right: calc(16px + env(safe-area-inset-right, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    padding: .85rem 1.3rem; font-weight: 700; font-size: 1rem; box-shadow: var(--shadow);
  }
  .scrim { position: fixed; inset: 0; background: rgba(8, 18, 14, .45); z-index: 20; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--surface); border-radius: 1rem 1rem 0 0; box-shadow: var(--shadow);
    max-height: 92vh; overflow-y: auto;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  }
  .sheet .wrap { max-width: 560px; display: flex; flex-direction: column; gap: .85rem; padding-block: 1rem 0; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet-head h3 { margin: 0; font-size: 1.05rem; }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: up .18s ease-out; }
    @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--surface); padding: .5rem .95rem; border-radius: .5rem;
    font-size: .88rem; box-shadow: var(--shadow); max-width: calc(100vw - 32px);
  }
  .note { font-size: .8rem; color: var(--muted); margin: .5rem 0 0; }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>월급 주기 <span>가계부</span></h1>
      <span id="storePill" class="pill">불러오는 중</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="화면">
      <button role="tab" id="tab-home" data-tab="home" aria-selected="true">홈</button>
      <button role="tab" id="tab-list" data-tab="list" aria-selected="false">내역</button>
      <button role="tab" id="tab-bills" data-tab="bills" aria-selected="false">카드대금</button>
      <button role="tab" id="tab-settings" data-tab="settings" aria-selected="false">설정</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view">
  <section class="block"><p class="empty">가계부를 불러오는 중이에요…</p></section>
</main>

<button class="fab" id="fab" type="button">+ 기록하기</button>
<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  'use strict';

  /* ---------- 기본값 ---------- */
  const DEFAULTS = {
    payday: 17,
    cards: [],
    expCats: ['식비', '카페·간식', '교통', '쇼핑', '생활', '주거·통신', '의료', '문화·여가', '경조사', '기타'],
    incCats: ['월급', '부수입', '용돈', '환급', '기타수입'],
  };
  const CARD_COLORS = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];
  const LOCAL_KEY = 'paycycle-ledger.v1';

  /* ---------- 날짜 도우미 (모두 'YYYY-MM-DD' 문자열) ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
  const dim = (y, m) => new Date(y, m, 0).getDate();
  const addM = (ym, k) => { const t = ym.y * 12 + (ym.m - 1) + k; return { y: Math.floor(t / 12), m: (t % 12) + 1 }; };
  const ymOf = s => { const p = parse(s); return { y: p.y, m: p.m }; };
  const ymKey = ym => `${ym.y}-${pad(ym.m)}`;
  const ymCmp = (a, b) => (a.y * 12 + a.m) - (b.y * 12 + b.m);
  const dayIn = (ym, d) => ymd(ym.y, ym.m, Math.min(d, dim(ym.y, ym.m)));
  const toDate = s => { const p = parse(s); return new Date(p.y, p.m - 1, p.d); };
  const fromDate = dt => ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  const addD = (s, k) => { const dt = toDate(s); dt.setDate(dt.getDate() + k); return fromDate(dt); };
  const diffD = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
  const today = () => fromDate(new Date());
  const WD = '일월화수목금토';
  const md = s => { const p = parse(s); return `${p.m}/${p.d}`; };
  const mdw = s => { const p = parse(s); return `${p.m}월 ${p.d}일 (${WD[toDate(s).getDay()]})`; };

  const won = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- 월급 주기 ---------- */
  // date가 속한 주기: 월급일 ~ 다음 월급일 전날. k로 앞뒤 주기 이동
  function cycleOf(s, payday, k = 0) {
    const ym = ymOf(s);
    let startYm = s >= dayIn(ym, payday) ? ym : addM(ym, -1);
    startYm = addM(startYm, k);
    const start = dayIn(startYm, payday);
    const next = dayIn(addM(startYm, 1), payday);
    return { start, end: addD(next, -1), next, ym: startYm };
  }

  /* ---------- 카드 결제 계산 ----------
     카드 설정: payDay(결제일), offset(이용기간 시작이 결제월로부터 몇 달 전), startDay(이용기간 시작일)
     예) 결제일 14일, 전월 1일~전월 말일 → offset 1, startDay 1
         결제일 25일, 전월 12일~당월 11일 → offset 1, startDay 12 */
  function billYm(card, s) {
    const p = parse(s);
    let st = { y: p.y, m: p.m };
    if (p.d < Math.min(card.startDay, dim(p.y, p.m))) st = addM(st, -1);
    return addM(st, card.offset);
  }
  function periodOf(card, P) {
    const S = addM(P, -card.offset);
    return { start: dayIn(S, card.startDay), end: addD(dayIn(addM(S, 1), card.startDay), -1) };
  }
  const payDateOf = (card, P) => dayIn(P, card.payDay);
  function monthWord(n) { return n === 0 ? '당월' : n === 1 ? '전월' : n === 2 ? '전전월' : `${n}개월 전`; }
  function periodText(card) {
    if (card.startDay === 1) return `${monthWord(card.offset)} 1일 ~ ${monthWord(card.offset)} 말일`;
    return `${monthWord(card.offset)} ${card.startDay}일 ~ ${monthWord(card.offset - 1)} ${card.startDay - 1}일`;
  }
  function billStatus(card, P, t) {
    const per = periodOf(card, P);
    if (t >= payDateOf(card, P)) return { cls: 'done', text: '결제일 지남' };
    if (t > per.end) return { cls: 'fixed', text: '금액 확정' };
    return { cls: 'open', text: '이용 중' };
  }

  // 할부는 첫 달에 나머지 금액을 몰아요 (카드사 일반 방식)
  function computeBills() {
    const map = new Map();
    for (const e of state.entries) {
      if (e.type !== 'out' || e.method === 'cash') continue;
      const card = cardById(e.method);
      if (!card) continue;
      const n = Math.max(1, e.inst || 1);
      const base = Math.floor(e.amount / n);
      const first = e.amount - base * (n - 1);
      const P0 = billYm(card, e.date);
      for (let k = 0; k < n; k++) {
        const P = addM(P0, k);
        const key = card.id + '|' + ymKey(P);
        if (!map.has(key)) map.set(key, { total: 0, items: [] });
        const b = map.get(key);
        const amt = k === 0 ? first : base;
        b.total += amt;
        b.items.push({ e, amt, k: k + 1, n });
      }
    }
    for (const b of map.values()) b.items.sort((a, c) => a.e.date < c.e.date ? -1 : 1);
    return map;
  }
  // [a, b] 기간 안에 결제일이 있는 카드대금
  function billsBetween(bills, a, b) {
    const out = [];
    for (const card of state.settings.cards) {
      for (let m = ymOf(a); ymCmp(m, ymOf(b)) <= 0; m = addM(m, 1)) {
        const pd = payDateOf(card, m);
        if (pd < a || pd > b) continue;
        const bill = bills.get(card.id + '|' + ymKey(m));
        out.push({ card, P: m, payDate: pd, total: bill ? bill.total : 0 });
      }
    }
    return out.sort((x, y) => x.payDate < y.payDate ? -1 : 1);
  }

  /* ---------- 상태 ---------- */
  const state = {
    mode: 'loading', // cloud | local | demo | loading
    settings: structuredClone(DEFAULTS),
    entries: [],
    tab: 'home',
    cycleK: 0,
    billYm: null,
    sheet: null,
    savedReal: null,
    readOnly: false,
  };
  const cardById = id => state.settings.cards.find(c => c.id === id);
  const cardColor = card => `var(${CARD_COLORS[Math.max(0, state.settings.cards.indexOf(card)) % CARD_COLORS.length]})`;
  const methodLabel = m => m === 'cash' ? '현금·계좌' : (cardById(m)?.name || '삭제된 카드');

  function normSettings(s) {
    const o = Object.assign(structuredClone(DEFAULTS), s || {});
    o.payday = clampInt(o.payday, 1, 31, 17);
    o.cards = (Array.isArray(o.cards) ? o.cards : []).map(c => ({
      id: String(c.id), name: String(c.name || '카드'),
      payDay: clampInt(c.payDay, 1, 31, 14), offset: clampInt(c.offset, 0, 2, 1), startDay: clampInt(c.startDay, 1, 31, 1),
    }));
    if (!Array.isArray(o.expCats) || !o.expCats.length) o.expCats = DEFAULTS.expCats.slice();
    if (!Array.isArray(o.incCats) || !o.incCats.length) o.incCats = DEFAULTS.incCats.slice();
    return o;
  }
  function normEntry(id, d) {
    return {
      id, date: String(d.date || today()), type: d.type === 'in' ? 'in' : 'out',
      amount: Math.max(0, Math.round(Number(d.amount) || 0)), cat: String(d.cat || '기타'),
      method: d.method ? String(d.method) : 'cash', inst: clampInt(d.inst, 1, 36, 1),
      memo: String(d.memo || ''), createdAt: Number(d.createdAt) || 0,
    };
  }
  function clampInt(v, lo, hi, def) { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; }
  const newId = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  /* ---------- 저장소 ---------- */
  const Store = {
    db: null, uid: null, settingsRef: null, entriesCol: null, settingsChain: Promise.resolve(),

    async init() {
      const c = window.claude;
      if (c && typeof c.use === 'function') {
        try {
          const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
          const uid = user ? await user.id() : null;
          if (db && uid) { this.useCloud(db, uid); return; }
        } catch (err) { /* 아래 로컬 모드로 */ }
      }
      this.useLocal();
    },

    useCloud(db, uid) {
      this.db = db; this.uid = uid;
      this.settingsRef = db.doc(`data/users/${uid}/settings`);
      this.entriesCol = db.doc(`data/users/${uid}/ledger`).collection('entries');
      if (state.mode !== 'demo') state.mode = 'cloud'; else state.savedReal = { mode: 'cloud', settings: state.settings, entries: [] };
      let gotS = false, gotE = false;
      this.settingsRef.onSnapshot(snap => {
        const s = normSettings(snap.exists ? snap.data() : null);
        if (state.mode === 'demo') { if (state.savedReal) state.savedReal.settings = s; }
        else state.settings = s;
        gotS = true; if (gotE) render();
      }, err => this.onErr(err));
      this.entriesCol.onSnapshot(snap => {
        const list = snap.docs.map(d => normEntry(d.id, d.data()));
        if (state.mode === 'demo') { if (state.savedReal) state.savedReal.entries = list; }
        else state.entries = list;
        gotE = true; if (gotS) render();
      }, err => this.onErr(err));
    },

    onErr(err) {
      if (err && err.code === 'revoked') { state.readOnly = true; toast('저장 권한이 없어져서 읽기만 할 수 있어요.'); render(); }
      else toast('불러오기에 문제가 생겼어요. 새로고침해 주세요.');
    },

    useLocal() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) { saved = null; }
      const s = normSettings(saved && saved.settings);
      const list = (saved && Array.isArray(saved.entries) ? saved.entries : []).map(e => normEntry(e.id || newId(), e));
      if (state.mode === 'demo') state.savedReal = { mode: 'local', settings: s, entries: list };
      else { state.mode = 'local'; state.settings = s; state.entries = list; }
      render();
    },
    persistLocal() {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ settings: state.settings, entries: state.entries })); }
      catch (e) { toast('이 브라우저에 저장하지 못했어요. 설정에서 백업을 내보내 두세요.'); }
    },

    async putEntry(e) {
      const body = { date: e.date, type: e.type, amount: e.amount, cat: e.cat, method: e.method, inst: e.inst, memo: e.memo, createdAt: e.createdAt };
      if (state.mode === 'cloud') { await this.entriesCol.doc(e.id).set(body); return; }
      const i = state.entries.findIndex(x => x.id === e.id);
      if (i >= 0) state.entries[i] = e; else state.entries.push(e);
      if (state.mode === 'local') this.persistLocal();
      render();
    },
    async removeEntry(id) {
      if (state.mode === 'cloud') { await this.entriesCol.doc(id).delete(); return; }
      state.entries = state.entries.filter(x => x.id !== id);
      if (state.mode === 'local') this.persistLocal();
      render();
    },
    saveSettings(next) {
      state.settings = normSettings(next);
      render();
      if (state.mode === 'cloud') {
        const body = JSON.parse(JSON.stringify(state.settings));
        this.settingsChain = this.settingsChain.then(() => this.settingsRef.set(body)).catch(err => {
          toast(err && err.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요.' : '설정을 저장하지 못했어요. 다시 시도해 주세요.');
        });
        return this.settingsChain;
      }
      if (state.mode === 'local') this.persistLocal();
      return Promise.resolve();
    },
  };

  /* ---------- 공통 조각 ---------- */
  function entryRow(e) {
    const isOut = e.type === 'out';
    const card = isOut && e.method !== 'cash' ? cardById(e.method) : null;
    const inst = isOut && e.inst > 1 ? `<span>${e.inst}개월 할부</span>` : '';
    const via = isOut ? `<span>${card ? `<i class="dot" style="background:${cardColor(card)}"></i> ` : ''}${esc(methodLabel(e.method))}</span>` : '';
    return `<button class="entry" type="button" data-act="edit" data-id="${esc(e.id)}">
      <span class="what">${esc(e.memo || e.cat)}</span>
      <span class="amt num ${isOut ? 'out' : 'in'}">${isOut ? '-' : '+'}${won(e.amount)}</span>
      <span class="meta"><span>${esc(e.cat)}</span>${via}${inst}</span>
    </button>`;
  }
  function dayGroups(list) {
    if (!list.length) return '';
    const byDay = new Map();
    for (const e of list) { if (!byDay.has(e.date)) byDay.set(e.date, []); byDay.get(e.date).push(e); }
    const days = [...byDay.keys()].sort().reverse();
    return days.map(d => {
      const items = byDay.get(d).sort((a, b) => b.createdAt - a.createdAt);
      const out = items.filter(e => e.type === 'out').reduce((s, e) => s + e.amount, 0);
      const inc = items.filter(e => e.type === 'in').reduce((s, e) => s + e.amount, 0);
      return `<div class="day">
        <div class="day-head"><b>${mdw(d)}${d === today() ? ' · 오늘' : ''}</b>
          <span class="num">${out ? `<span class="out">-${won(out)}</span>` : ''}${out && inc ? ' · ' : ''}${inc ? `<span class="in">+${won(inc)}</span>` : ''}</span></div>
        ${items.map(entryRow).join('')}
      </div>`;
    }).join('');
  }
  const inRange = (e, a, b) => e.date >= a && e.date <= b;
  const sum = (list, f) => list.filter(f).reduce((s, e) => s + e.amount, 0);

  function cycleBox(title, cyc, bills, isNow, t) {
    const list = billsBetween(bills, cyc.start, cyc.end);
    const total = list.reduce((s, b) => s + b.total, 0);
    const rows = list.length ? list.map(b => {
      const st = billStatus(b.card, b.P, t);
      return `<div class="bill-line"><i class="dot" style="background:${cardColor(b.card)}"></i>
        <span class="nm">${esc(b.card.name)} <span class="muted small">${md(b.payDate)}</span></span>
        <span class="num">${won(b.total)} <span class="chip ${st.cls}">${st.text}</span></span></div>`;
    }).join('') : `<p class="muted small" style="margin:.3rem 0 0">이 기간에 결제일인 카드가 없어요.</p>`;
    return `<div class="cyc ${isNow ? 'now' : ''}">
      <div class="label">${title} · ${md(cyc.start)}~${md(cyc.end)}</div>
      <div class="sum num">${won(total)}</div>
      ${rows}
    </div>`;
  }

  /* ---------- 화면: 홈 ---------- */
  function viewHome() {
    const t = today();
    const s = state.settings;
    const cyc = cycleOf(t, s.payday);
    const nextCyc = cycleOf(t, s.payday, 1);
    const left = diffD(t, cyc.next);
    const isPayday = t === cyc.start;
    const inCyc = state.entries.filter(e => inRange(e, cyc.start, t));
    const spent = sum(inCyc, e => e.type === 'out');
    const cardSpent = sum(inCyc, e => e.type === 'out' && e.method !== 'cash');
    const income = sum(inCyc, e => e.type === 'in');
    const days = diffD(cyc.start, t) + 1;
    const bills = computeBills();
    const nothing = !state.entries.length && !s.cards.length;

    const recent = state.entries.filter(e => e.date <= t && e.date >= addD(t, -6));
    const future = state.entries.filter(e => e.date > t);

    const onboarding = nothing && state.mode !== 'demo' ? `
      <section class="block">
        <h2>처음 시작하기</h2>
        <ol class="steps">
          <li><span><b>설정</b>에서 쓰는 카드를 등록해요. 카드 명세서에 있는 <b>결제일</b>과 <b>이용기간</b>만 있으면 돼요.</span></li>
          <li><span>돈을 쓸 때마다 <b>+ 기록하기</b>로 금액, 분류, 어떤 카드로 냈는지 적어요.</span></li>
          <li><span>그러면 <b>카드대금</b> 탭에서 카드별로 언제 얼마가 빠져나가는지 자동으로 계산돼요.</span></li>
        </ol>
        <div class="btn-row" style="margin-top:.9rem">
          <button class="btn primary" type="button" data-act="goto" data-tab="settings">카드 등록하러 가기</button>
          <button class="btn" type="button" data-act="demo">예시 데이터로 둘러보기</button>
        </div>
      </section>` : '';

    return `
      ${onboarding}
      <section class="block">
        <div class="today">
          <div><div class="muted small">오늘</div><div class="date">${mdw(t)}</div></div>
          <span class="dday">${isPayday ? '오늘 월급날' : `월급까지 D-${left}`}</span>
        </div>
        <p class="muted small" style="margin:.3rem 0 .8rem">이번 월급 주기 ${md(cyc.start)} ~ ${md(cyc.end)} · ${days}일째</p>
        <div class="stats">
          <div class="stat big"><div class="k">쓴 돈</div><div class="v num out">${won(spent)}</div></div>
          <div class="stat"><div class="k">그중 카드</div><div class="v num">${won(cardSpent)}</div></div>
          <div class="stat"><div class="k">하루 평균</div><div class="v num">${won(spent / days)}</div></div>
        </div>
        ${income ? `<p class="note">이번 주기 수입 <span class="num in">+${won(income)}</span></p>` : ''}
      </section>

      <section class="block">
        <h2>월급 주기별 카드대금</h2>
        ${s.cards.length ? `<div class="cycle-pair">
          ${cycleBox('이번 주기', cyc, bills, true, t)}
          ${cycleBox('다음 주기', nextCyc, bills, false, t)}
        </div>
        <p class="note">카드는 쓴 날 기준으로 기록되고, 여기서는 결제일 기준으로 다시 묶어 보여 줘요. '이용 중'인 금액은 앞으로 더 쓰면 늘어나요.</p>`
        : `<p class="empty">등록된 카드가 없어요. <button class="btn ghost" type="button" data-act="goto" data-tab="settings">설정에서 카드 추가</button></p>`}
      </section>

      <section class="block">
        <div class="row-between"><h2 class="h2" style="margin:0">최근 7일</h2>
          <button class="btn ghost small" type="button" data-act="goto" data-tab="list">전체 내역 보기</button></div>
        <div style="margin-top:.6rem">${recent.length ? dayGroups(recent) : `<p class="empty">최근 7일 기록이 없어요. 오늘 쓴 돈부터 적어 볼까요?</p>`}</div>
        ${future.length ? `<p class="note">미래 날짜로 적은 기록 ${future.length}건은 내역 탭에 있어요.</p>` : ''}
      </section>`;
  }

  /* ---------- 화면: 내역 ---------- */
  function viewList() {
    const s = state.settings;
    const cyc = cycleOf(today(), s.payday, state.cycleK);
    const list = state.entries.filter(e => inRange(e, cyc.start, cyc.end));
    const out = sum(list, e => e.type === 'out');
    const inc = sum(list, e => e.type === 'in');
    const byCat = new Map();
    for (const e of list) if (e.type === 'out') byCat.set(e.cat, (byCat.get(e.cat) || 0) + e.amount);
    const cats = [...byCat.entries()].sort((a, b) => b[1] - a[1]);
    const max = cats.length ? cats[0][1] : 1;

    return `
      <section class="block">

          <button class="icon-btn" type="button" data-act="cyc" data-k="1" aria-label="다음 주기">›</button>

          <div class="stat"><div class="k">수입</div><div class="v num in">${won(inc)}</div></div>
          <div class="stat"><div class="k">수입 − 지출</div><div class="v num">${won(inc - out)}</div></div>
        </div>
        ${state.cycleK !== 0 ? `<div style="margin-top:.6rem"><button class="btn ghost small" type="button" data-act="cyc0">이번 주기로 돌아가기</button></div>` : ''}
      </section>
      ${cats.length ? `<section class="block"><h2>분류별 지출</h2><div class="bars">
        ${cats.map(([c, v]) => `<div class="bar-row"><span class="lbl">${esc(c)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, v / max * 100)}%"></div></div>
          <span class="v num">${won(v)}</span></div>`).join('')}

      <section class="block">

  }

  /* ---------- 화면: 카드대금 ---------- */
  function defaultBillYm() {
    const t = today();
    const ym = ymOf(t);
    const cards = state.settings.cards;
    if (cards.some(c => payDateOf(c, ym) >= t)) return ym;
    return addM(ym, 1);
  }
  function viewBills() {
    const cards = state.settings.cards;
    if (!cards.length) {
      return `<section class="block"><h2>카드대금</h2>
        <p class="empty">카드를 등록하면 결제일·이용기간에 맞춰 카드별 청구 금액을 계산해 드려요.</p>
        <div class="btn-row" style="justify-content:center"><button class="btn primary" type="button" data-act="goto" data-tab="settings">카드 등록하기</button>
        ${state.mode !== 'demo' ? `<button class="btn" type="button" data-act="demo">예시로 둘러보기</button>` : ''}</div></section>`;
    }
    const t = today();
    const P = state.billYm || defaultBillYm();
    const bills = computeBills();
    const rows = cards.map(card => ({ card, bill: bills.get(card.id + '|' + ymKey(P)) || { total: 0, items: [] } }));
    const total = rows.reduce((s, r) => s + r.bill.total, 0);

    const start = ymOf(t);
    const months = Array.from({ length: 6 }, (_, i) => addM(start, i));
    const fc = months.map(m => ({ m, parts: cards.map(c => ({ c, v: (bills.get(c.id + '|' + ymKey(m)) || { total: 0 }).total })) }));
    const fmax = Math.max(1, ...fc.map(f => f.parts.reduce((s, p) => s + p.v, 0)));

    const cardBlocks = rows.map(({ card, bill }) => {
      const per = periodOf(card, P);
      const st = billStatus(card, P, t);
      return `<div class="card-bill">
        <div class="hd">
          <span class="swatch" style="background:${cardColor(card)}"></span>
          <span class="nm">${esc(card.name)}</span>
          <span class="tot num">${won(bill.total)}</span>
          <span class="sub">${mdw(payDateOf(card, P))} 출금 · 이용기간 ${md(per.start)}~${md(per.end)} <span class="chip ${st.cls}">${st.text}</span></span>
        </div>
        ${bill.items.length ? `<details><summary>사용 내역 ${bill.items.length}건 보기</summary><div class="items">
          ${bill.items.map(it => `<div class="item"><span class="ds num">${md(it.e.date)}</span>
            <span>${esc(it.e.memo || it.e.cat)}${it.n > 1 ? ` <span class="muted small">할부 ${it.k}/${it.n}</span>` : ''}</span>
            <span class="num">${won(it.amt)}</span></div>`).join('')}
        </div></details>` : ''}
      </div>`;
    }).join('');

    return `
      <section class="block">
        <div class="pager">
          <button class="icon-btn" type="button" data-act="bm" data-k="-1" aria-label="이전 달">‹</button>
          <div class="title">${P.y}년 ${P.m}월 결제분<small>모든 카드 합계</small></div>
          <button class="icon-btn" type="button" data-act="bm" data-k="1" aria-label="다음 달">›</button>
        </div>
        <div class="num" style="text-align:center;font-size:1.8rem;font-weight:600;margin:.6rem 0 .2rem">${won(total)}</div>
        <p class="note" style="text-align:center;margin-top:0">결제일이 주말·공휴일이면 보통 다음 영업일에 빠져나가요.</p>
      </section>
      <section class="block">${cardBlocks}</section>
      <section class="block">
        <h2>앞으로 6개월 카드대금</h2>
        <div class="forecast">
          ${fc.map(f => {
            const tot = f.parts.reduce((s, p) => s + p.v, 0);
            return `<button class="fc" type="button" data-act="bmset" data-ym="${ymKey(f.m)}" aria-pressed="${ymKey(f.m) === ymKey(P)}" aria-label="${f.m.m}월 ${won(tot)}">
              <span class="vv num">${tot ? Math.round(tot / 10000).toLocaleString('ko-KR') + '만' : '0'}</span>
              <span class="stack" style="height:${tot ? Math.max(3, tot / fmax * 100) : 1.5}%">
                ${f.parts.filter(p => p.v).map(p => `<span style="height:${p.v / tot * 100}%;background:${cardColor(p.c)}"></span>`).join('')}
              </span>
              <span class="lb">${f.m.m}월</span></button>`;
          }).join('')}
        </div>
        <div class="legend">${cards.map(c => `<span><i class="dot" style="background:${cardColor(c)}"></i>${esc(c.name)}</span>`).join('')}</div>
        <p class="note">지금까지 기록한 사용분과 남은 할부만 들어가 있어요. 막대를 누르면 그 달로 이동해요.</p>
      </section>`;
  }

  /* ---------- 화면: 설정 ---------- */
  let cardDraft = null;
  function cardForm() {
    const c = cardDraft;
    const opt = (v, cur, label) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${label}</option>`;
    const days = Array.from({ length: 31 }, (_, i) => i + 1);
    const ex = (() => {
      const t = today();
      const P = billYm(c, t);
      const per = periodOf(c, P);
      return `오늘(${md(t)}) 쓰면 → <b>${P.m}월 ${parse(payDateOf(c, P)).d}일</b>에 결제 (이용기간 ${md(per.start)}~${md(per.end)})`;
    })();
    return `<div class="field"><span>카드 이름</span><input id="cf-name" value="${esc(c.name)}" maxlength="20" placeholder="예: 신한 Deep, 회사 법인카드"></div>
      <div class="grid3">
        <label class="field"><span>결제일</span><select id="cf-pay">${days.map(d => opt(d, c.payDay, d + '일')).join('')}</select></label>
        <label class="field"><span>이용기간 시작 달</span><select id="cf-off">${[0, 1, 2].map(n => opt(n, c.offset, monthWord(n))).join('')}</select></label>
        <label class="field"><span>이용기간 시작일</span><select id="cf-start">${days.map(d => opt(d, c.startDay, d + '일')).join('')}</select></label>
      </div>
      <div class="preview">이용기간: <b>${periodText(c)}</b><br>${ex}</div>
      <p class="note" style="margin:0">카드사 앱이나 명세서의 "이용기간"을 보고 맞춰 주세요. 예) 14일 결제 → 전월 1일~전월 말일, 25일 결제 → 전월 12일~당월 11일.</p>
      <div class="btn-row">
        <button class="btn primary" type="button" data-act="card-save">${c.isNew ? '카드 추가' : '저장'}</button>
        <button class="btn" type="button" data-act="card-cancel">취소</button>
        ${c.isNew ? '' : `<button class="btn danger" type="button" data-act="card-del">${c.confirmDel ? '정말 삭제' : '카드 삭제'}</button>`}
      </div>
      ${c.confirmDel ? `<p class="note" style="margin:0">이 카드로 적은 기록은 남지만 카드대금 계산에서 빠져요. 한 번 더 누르면 삭제돼요.</p>` : ''}`;
  }
  function viewSettings() {
    const s = state.settings;
    const used = id => state.entries.filter(e => e.method === id).length;
    const modeText = {
      cloud: '내 계정에 저장돼요. 다른 기기에서 이 페이지를 열어도 같은 가계부가 보여요. 다른 사람은 볼 수 없어요.',
      local: '지금은 이 브라우저에만 저장돼요. 브라우저 기록을 지우면 사라질 수 있으니 가끔 백업을 내보내 두세요.',
      demo: '예시 데이터를 보고 있어요. 여기서 바꾼 내용은 저장되지 않아요.',
      loading: '불러오는 중이에요.',
    }[state.mode];
    return `
      <section class="block">
        <h2>월급일</h2>
        <label class="field" style="max-width:12rem"><span>매달 월급이 들어오는 날</span>
          <select id="set-payday">${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<option value="${d}" ${d === s.payday ? 'selected' : ''}>${d}일</option>`).join('')}</select></label>
        <p class="note">월급일부터 다음 월급일 전날까지를 한 주기로 묶어 계산해요. 말일보다 큰 날짜는 그달 말일로 봐요.</p>
      </section>

      <section class="block">
        <div class="row-between"><h2 class="h2" style="margin:0">내 카드</h2>
          ${cardDraft ? '' : `<button class="btn" type="button" data-act="card-new">+ 카드 추가</button>`}</div>
        <div style="margin-top:.5rem">
          ${s.cards.map(c => cardDraft && cardDraft.id === c.id ? '' : `<div class="card-row">
            <i class="dot" style="background:${cardColor(c)}"></i>
            <b>${esc(c.name)}</b>
            <button class="btn ghost" type="button" data-act="card-edit" data-id="${esc(c.id)}">수정</button>
            <span class="sub">매달 ${c.payDay}일 결제 · ${periodText(c)} · 기록 ${used(c.id)}건</span>
          </div>`).join('')}
          ${!s.cards.length && !cardDraft ? `<p class="empty">아직 등록한 카드가 없어요.</p>` : ''}
        </div>
        ${cardDraft ? `<div style="display:flex;flex-direction:column;gap:.7rem;margin-top:.8rem">${cardForm()}</div>` : ''}
      </section>

      <section class="block">
        <h2>분류</h2>
        <label class="field"><span>지출 분류 (쉼표로 구분)</span><textarea id="set-exp" rows="2">${esc(s.expCats.join(', '))}</textarea></label>
        <label class="field" style="margin-top:.6rem"><span>수입 분류 (쉼표로 구분)</span><textarea id="set-inc" rows="2">${esc(s.incCats.join(', '))}</textarea></label>
        <div class="btn-row" style="margin-top:.6rem"><button class="btn" type="button" data-act="cats-save">분류 저장</button></div>
      </section>

      <section class="block">
        <h2>저장과 백업</h2>
        <p style="margin:0 0 .7rem">${modeText}</p>
        <div class="btn-row">
          <button class="btn" type="button" data-act="export">백업 파일 내보내기</button>
          <label class="btn" for="importFile">백업 불러오기</label>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
          ${state.mode === 'demo' ? `<button class="btn primary" type="button" data-act="demo-end">내 가계부로 돌아가기</button>`
            : `<button class="btn" type="button" data-act="demo">예시 데이터로 둘러보기</button>`}
        </div>
        <p class="note">기록 ${state.entries.length}건 · 카드 ${s.cards.length}개</p>
      </section>`;
  }

  /* ---------- 기록 시트 ---------- */
  function openSheet(entry) {
    if (state.readOnly) { toast('지금은 읽기만 할 수 있어요.'); return; }
    const s = state.settings;
    const last = [...state.entries].sort((a, b) => b.createdAt - a.createdAt).find(e => e.type === 'out');
    state.sheet = entry ? { ...entry, isNew: false, confirmDel: false } : {
      id: newId(), isNew: true, type: 'out', amount: 0, date: today(), cat: s.expCats[0],
      method: last && (last.method === 'cash' || cardById(last.method)) ? last.method : (s.cards[0]?.id || 'cash'),
      inst: 1, memo: '', createdAt: Date.now(), confirmDel: false,
    };
    renderSheet();
    setTimeout(() => { const a = document.getElementById('sh-amount'); if (a && state.sheet.isNew) a.focus(); }, 30);
  }
  function closeSheet() { state.sheet = null; renderSheet(); }
  function sheetPreview(f) {
    if (f.type !== 'out' || f.method === 'cash') return '';
    const card = cardById(f.method);
    if (!card || !f.date) return '';
    const P = billYm(card, f.date);
    const pd = payDateOf(card, P);
    const n = f.inst || 1;
    if (n > 1) {
      const last = addM(P, n - 1);
      return `<div class="preview">${esc(card.name)} · <b>${P.y !== ymOf(today()).y ? P.y + '년 ' : ''}${P.m}월 ${parse(pd).d}일</b>부터 ${n}개월 동안 나눠서 결제 (마지막 ${last.m}월)</div>`;
    }
    return `<div class="preview">${esc(card.name)} · <b>${P.y !== ymOf(today()).y ? P.y + '년 ' : ''}${P.m}월 ${parse(pd).d}일</b> 카드대금에 들어가요</div>`;
  }
  function renderSheet() {
    const root = document.getElementById('sheetRoot');
    const f = state.sheet;
    document.getElementById('fab').hidden = !!f;
    if (!f) { root.innerHTML = ''; return; }
    const s = state.settings;
    const cats = f.type === 'out' ? s.expCats : s.incCats;
    if (!cats.includes(f.cat)) f.cat = cats[0];
    const insts = [1, 2, 3, 4, 5, 6, 10, 12, 18, 24];
    root.innerHTML = `<div class="scrim" data-act="close"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
        <form class="wrap" id="sheetForm" novalidate>
          <div class="sheet-head"><h3 id="sh-title">${f.isNew ? '새 기록' : '기록 고치기'}</h3>
            <button class="icon-btn" type="button" data-act="close" aria-label="닫기">×</button></div>
          <div class="seg">
            <button type="button" class="o" data-act="type" data-v="out" aria-pressed="${f.type === 'out'}">지출</button>
            <button type="button" class="i" data-act="type" data-v="in" aria-pressed="${f.type === 'in'}">수입</button>
          </div>
          <label class="field"><span>금액 (원)</span>
            <input id="sh-amount" class="amount-input" inputmode="numeric" autocomplete="off" value="${f.amount ? f.amount.toLocaleString('ko-KR') : ''}" placeholder="0"></label>
          <div class="chips">${[1000, 5000, 10000, 50000, 100000].map(v => `<button type="button" data-act="add-amt" data-v="${v}">+${v >= 10000 ? (v / 10000) + '만' : (v / 1000) + '천'}</button>`).join('')}
            <button type="button" data-act="add-amt" data-v="0">지우기</button></div>
          <div class="field"><span>분류</span><div class="chips">
            ${cats.map(c => `<button type="button" data-act="cat" data-v="${esc(c)}" aria-pressed="${c === f.cat}">${esc(c)}</button>`).join('')}
          </div></div>
          <div class="grid2">
            <label class="field"><span>날짜</span><input id="sh-date" type="date" value="${esc(f.date)}"></label>
            ${f.type === 'out' ? `<label class="field"><span>결제 수단</span><select id="sh-method">
              <option value="cash" ${f.method === 'cash' ? 'selected' : ''}>현금·계좌이체</option>
              ${s.cards.map(c => `<option value="${esc(c.id)}" ${f.method === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
              ${f.method !== 'cash' && !cardById(f.method) ? `<option value="${esc(f.method)}" selected>삭제된 카드</option>` : ''}
            </select></label>` : '<span></span>'}
          </div>
          ${f.type === 'out' && f.method !== 'cash' ? `<label class="field"><span>할부</span><select id="sh-inst">
            ${insts.map(n => `<option value="${n}" ${n === f.inst ? 'selected' : ''}>${n === 1 ? '일시불' : n + '개월'}</option>`).join('')}
          </select></label>` : ''}
          <label class="field"><span>메모</span><input id="sh-memo" value="${esc(f.memo)}" maxlength="60" placeholder="예: 점심 김밥, 지하철"></label>
          <div id="sh-preview">${sheetPreview(f)}</div>
          <div class="btn-row">
            <button class="btn primary" type="submit" style="flex:1">${f.isNew ? '저장' : '고친 내용 저장'}</button>
            ${f.isNew ? '' : `<button class="btn danger" type="button" data-act="del">${f.confirmDel ? '정말 삭제' : '삭제'}</button>`}
          </div>
          ${s.cards.length || f.type === 'in' ? '' : `<p class="note" style="margin:0">카드를 등록하면 결제 수단에서 고를 수 있어요 (설정 탭).</p>`}
        </form>
      </div>`;
  }
  function readSheetInputs() {
    const f = state.sheet; if (!f) return;
    const a = document.getElementById('sh-amount'); if (a) f.amount = parseInt(a.value.replace(/[^\d]/g, ''), 10) || 0;
    const d = document.getElementById('sh-date'); if (d && d.value) f.date = d.value;
    const m = document.getElementById('sh-method'); if (m) f.method = m.value;
    const i = document.getElementById('sh-inst'); f.inst = i ? parseInt(i.value, 10) : 1;
    const me = document.getElementById('sh-memo'); if (me) f.memo = me.value.trim();
    if (f.type === 'in') { f.method = 'cash'; f.inst = 1; }
    if (f.method === 'cash') f.inst = 1;
  }
  async function submitSheet() {
    readSheetInputs();
    const f = state.sheet;
    if (!f.amount) { toast('금액을 적어 주세요.'); document.getElementById('sh-amount')?.focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) { toast('날짜를 골라 주세요.'); return; }
    const e = normEntry(f.id, f);
    const wasNew = f.isNew;
    closeSheet();
    try {
      await Store.putEntry(e);
      toast(wasNew ? `${e.type === 'out' ? '지출' : '수입'} ${won(e.amount)} 기록했어요.` : '고쳤어요.');
    } catch (err) {
      toast(err && err.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요. 오래된 기록을 백업 후 정리해 주세요.' : '저장하지 못했어요. 다시 시도해 주세요.');
    }
  }

  /* ---------- 렌더 ---------- */
  function render() {
    const pill = document.getElementById('storePill');
    const pills = {
      cloud: ['ok', '계정에 저장 중'], local: ['warn', '이 브라우저에만 저장'], demo: ['warn', '예시 데이터'], loading: ['', '불러오는 중'],
    };
    const [cls, txt] = state.readOnly ? ['warn', '읽기 전용'] : pills[state.mode];
    pill.className = 'pill ' + cls; pill.textContent = txt;

    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
    const view = document.getElementById('view');
    if (state.mode === 'loading') return;
    const banner = state.mode === 'demo' ? `<div class="banner"><span>예시 데이터를 보고 있어요. 저장되지 않아요.</span>
      <button class="btn" type="button" data-act="demo-end">내 가계부로 돌아가기</button></div>` : '';
    const body = { home: viewHome, list: viewList, bills: viewBills, settings: viewSettings }[state.tab]();
    view.innerHTML = banner + body;
  }

  let toastTimer = 0;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  /* ---------- 이벤트 ---------- */
  document.querySelector('nav.tabs').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-tab]'); if (!b) return;
    state.tab = b.dataset.tab; cardDraft = null; render(); window.scrollTo(0, 0);
  });
  document.getElementById('fab').addEventListener('click', () => openSheet(null));

  document.addEventListener('click', async ev => {
    const el = ev.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    const s = state.settings;
    switch (act) {
      case 'goto': state.tab = el.dataset.tab; cardDraft = null; render(); window.scrollTo(0, 0); break;
      case 'demo': startDemo(); toast('예시 데이터를 불러왔어요.'); break;
      case 'demo-end': endDemo(); break;
      case 'cyc': state.cycleK += Number(el.dataset.k); render(); break;
      case 'cyc0': state.cycleK = 0; render(); break;
      case 'bm': state.billYm = addM(state.billYm || defaultBillYm(), Number(el.dataset.k)); render(); break;
      case 'bmset': state.billYm = ymOf(el.dataset.ym + '-01'); render(); break;
      case 'edit': { const e = state.entries.find(x => x.id === el.dataset.id); if (e) openSheet(e); break; }
      case 'close': closeSheet(); break;
      case 'type': readSheetInputs(); state.sheet.type = el.dataset.v; renderSheet(); break;
      case 'cat': readSheetInputs(); state.sheet.cat = el.dataset.v; renderSheet(); break;
      case 'add-amt': {
        readSheetInputs();
        const v = Number(el.dataset.v);
        state.sheet.amount = v ? state.sheet.amount + v : 0;
        const a = document.getElementById('sh-amount'); a.value = state.sheet.amount ? state.sheet.amount.toLocaleString('ko-KR') : '';
        break;
      }
      case 'del': {
        const f = state.sheet;
        if (!f.confirmDel) { readSheetInputs(); f.confirmDel = true; renderSheet(); break; }
        const id = f.id; closeSheet();
        try { await Store.removeEntry(id); toast('삭제했어요.'); } catch (err) { toast('삭제하지 못했어요. 다시 시도해 주세요.'); }
        break;
      }
      case 'card-new':
        cardDraft = { id: 'c' + Date.now().toString(36), name: '', payDay: 14, offset: 1, startDay: 1, isNew: true }; render(); break;
      case 'card-edit': { const c = cardById(el.dataset.id); if (c) { cardDraft = { ...c, isNew: false }; render(); } break; }
      case 'card-cancel': cardDraft = null; render(); break;
      case 'card-save': {
        readCardInputs();
        const c = cardDraft;
        if (!c.name.trim()) { toast('카드 이름을 적어 주세요.'); document.getElementById('cf-name')?.focus(); return; }
        const card = { id: c.id, name: c.name.trim(), payDay: c.payDay, offset: c.offset, startDay: c.startDay };
        const cards = c.isNew ? [...s.cards, card] : s.cards.map(x => x.id === c.id ? card : x);
        cardDraft = null;
        Store.saveSettings({ ...s, cards });
        toast(c.isNew ? '카드를 추가했어요.' : '카드를 고쳤어요.');
        break;
      }
      case 'card-del': {
        readCardInputs();
        if (!cardDraft.confirmDel) { cardDraft.confirmDel = true; render(); break; }
        const id = cardDraft.id; cardDraft = null;
        Store.saveSettings({ ...s, cards: s.cards.filter(x => x.id !== id) });
        toast('카드를 삭제했어요.');
        break;
      }
      case 'cats-save': {
        const split = id => [...new Set(document.getElementById(id).value.split(/[,\n]/).map(x => x.trim()).filter(Boolean))].slice(0, 30);
        const exp = split('set-exp'), inc = split('set-inc');
        if (!exp.length || !inc.length) { toast('분류를 하나 이상 남겨 주세요.'); return; }
        Store.saveSettings({ ...s, expCats: exp, incCats: inc });
        toast('분류를 저장했어요.');
        break;
      }
      case 'export': exportBackup(); break;
    }
  });

  function readCardInputs() {
    if (!cardDraft) return;
    const v = id => document.getElementById(id);
    if (v('cf-name')) cardDraft.name = v('cf-name').value;
    if (v('cf-pay')) cardDraft.payDay = Number(v('cf-pay').value);
    if (v('cf-off')) cardDraft.offset = Number(v('cf-off').value);
    if (v('cf-start')) cardDraft.startDay = Number(v('cf-start').value);
  }

  document.addEventListener('change', ev => {
    const id = ev.target.id;
    if (id === 'set-payday') { Store.saveSettings({ ...state.settings, payday: Number(ev.target.value) }); toast(`월급일을 ${ev.target.value}일로 바꿨어요.`); }
    else if (id === 'cf-pay' || id === 'cf-off' || id === 'cf-start') { readCardInputs(); render(); }
    else if (id === 'sh-method' || id === 'sh-date' || id === 'sh-inst') {
      readSheetInputs();
      if (id === 'sh-method') renderSheet();
      else document.getElementById('sh-preview').innerHTML = sheetPreview(state.sheet);
    }
    else if (id === 'importFile') importBackup(ev.target);
  });
  document.addEventListener('input', ev => {
    if (ev.target.id === 'sh-amount') {
      const n = parseInt(ev.target.value.replace(/[^\d]/g, ''), 10);
      ev.target.value = Number.isFinite(n) ? n.toLocaleString('ko-KR') : '';
    }
  });
  document.addEventListener('submit', ev => {
    if (ev.target.id === 'sheetForm') { ev.preventDefault(); submitSheet(); }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && state.sheet) closeSheet(); });

  /* ---------- 백업 ---------- */
  async function exportBackup() {
    const data = JSON.stringify({ app: 'paycycle-ledger', version: 1, exportedAt: new Date().toISOString(), settings: state.settings, entries: state.entries }, null, 2);
    const filename = `가계부-백업-${today()}.json`;
    try {
      const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
      if (dl) {
        const r = await dl.save({ filename, data });
        if (r && r.status === 'saved') toast('백업 파일을 저장했어요.');
        return;
      }
    } catch (err) { if (err && err.code !== 'unavailable') { toast('백업 저장을 취소했거나 실패했어요.'); return; } }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (err) { toast('이 화면에서는 파일을 저장할 수 없어요.'); }
  }
  async function importBackup(input) {
    const file = input.files && input.files[0]; input.value = '';
    if (!file) return;
    if (state.mode === 'demo') { toast('예시 데이터를 보는 중에는 불러올 수 없어요.'); return; }
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch (e) { toast('백업 파일을 읽지 못했어요. 이 가계부에서 내보낸 .json 파일인지 확인해 주세요.'); return; }
    if (!parsed || !Array.isArray(parsed.entries)) { toast('가계부 백업 파일이 아니에요.'); return; }
    const have = new Set(state.entries.map(e => e.id));
    const incoming = parsed.entries.map(e => normEntry(String(e.id || newId()), e)).filter(e => !have.has(e.id));
    const s = normSettings(parsed.settings);
    const cards = [...state.settings.cards];
    for (const c of s.cards) if (!cards.some(x => x.id === c.id)) cards.push(c);
    await Store.saveSettings({ ...state.settings, cards });
    let ok = 0;
    for (const e of incoming) { try { await Store.putEntry(e); ok++; } catch (err) { break; } }
    toast(`기록 ${ok}건을 불러왔어요${incoming.length > ok ? ` (${incoming.length - ok}건 실패)` : ''}.`);
  }

  /* ---------- 시작 ---------- */
  render();
  Store.init();
})();
</script>
