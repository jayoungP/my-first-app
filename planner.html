<title>하루 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Gowun+Batang:wght@700&display=swap">
<style>
  /* 레이아웃: 왼쪽 월간 달력 + 오른쪽 선택한 날의 일정·할 일 (좁은 화면에서는 위아래로) */
  :root {
    --bg: #eef1f4;
    --paper: #ffffff;
    --ink: #1c2530;
    --muted: #5f6b78;
    --line: #d9dfe6;
    --accent: #1f5f8b;
    --accent-soft: #e2edf5;
    --sun: #c8352e;
    --sat: #2a62b8;
    --today: #1f5f8b;
    --cat-work: #2f6fb0;
    --cat-life: #b8860b;
    --cat-study: #8a5bc4;
    --cat-meet: #d4602a;
    --school: #0f7c80;
    --exam: #c8352e;
    --off: #8b96a3;
    --susi: #b0477f;
    --ann: #7a5a9e;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgb(28 37 48 / .06), 0 4px 16px rgb(28 37 48 / .06);
    --font-display: "Gowun Batang", "IBM Plex Sans KR", serif;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --paper: #1a2129; --ink: #e4e9ee; --muted: #93a0ad; --line: #2c3540;
      --accent: #7db6dd; --accent-soft: #1f3344; --sun: #f0817a; --sat: #86aef0; --today: #7db6dd;
      --cat-work: #6ea6e0; --cat-life: #e2bd4f; --cat-study: #b893ea; --cat-meet: #ef8c5c; --school: #4fc1c4; --exam: #f0817a; --off: #7c8996; --susi: #e48ab9; --ann: #c3a6e6;
      --danger: #f08a82; --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --paper: #1a2129; --ink: #e4e9ee; --muted: #93a0ad; --line: #2c3540;
    --accent: #7db6dd; --accent-soft: #1f3344; --sun: #f0817a; --sat: #86aef0; --today: #7db6dd;
    --cat-work: #6ea6e0; --cat-life: #e2bd4f; --cat-study: #b893ea; --cat-meet: #ef8c5c; --school: #4fc1c4; --exam: #f0817a; --off: #7c8996; --susi: #e48ab9; --ann: #c3a6e6;
    --danger: #f08a82; --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 1180px; margin: 0 auto;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 20px;
  }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  header h1 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; letter-spacing: -.01em; }
  .sync { font-size: .8rem; color: var(--muted); }
  .today-line { margin-left: auto; color: var(--muted); font-size: .9rem; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

  /* 달력 */
  .cal { padding: 16px; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cal-head h2 { margin: 0 auto 0 0; font-size: 1.25rem; font-weight: 700; }
  .cal-head h2 .num { font-family: var(--font-num); }
  .icon-btn {
    border: 1px solid var(--line); background: var(--paper); border-radius: 8px;
    min-width: 36px; height: 36px; padding: 0 10px; display: inline-grid; place-items: center;
  }
  .icon-btn:hover { background: var(--accent-soft); }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow { text-align: center; font-size: .78rem; font-weight: 600; color: var(--muted); padding-bottom: 6px; letter-spacing: .04em; }
  .dow.sun { color: var(--sun); } .dow.sat { color: var(--sat); }
  .day {
    min-height: 92px; border-top: 1px solid var(--line); padding: 5px 4px 4px;
    background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left;
    display: flex; flex-direction: column; gap: 2px; min-width: 0; border-radius: 0;
  }
  .day:hover { background: var(--accent-soft); }
  .day.other { opacity: .38; }
  .day.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); border-radius: 6px; }
  .dnum { font-family: var(--font-num); font-size: .85rem; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
  .day.sun .dnum, .day.hol .dnum { color: var(--sun); }
  .day.sat:not(.hol) .dnum { color: var(--sat); }
  .day.today .dnum { background: var(--today); color: var(--paper); }
  .hol-name { font-size: .66rem; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip {
    font-size: .7rem; line-height: 1.35; padding: 1px 5px; border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--ink);
    border-left: 3px solid var(--c);
  }
  .more { font-size: .68rem; color: var(--muted); padding-left: 4px; }
  .dots { display: none; gap: 3px; padding-left: 4px; flex-wrap: wrap; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  @media (max-width: 560px) {
    .day { min-height: 58px; align-items: center; }
    .chip, .more, .hol-name { display: none; }
    .dots { display: flex; justify-content: center; padding: 0; }
  }

  /* 날짜 패널 */
  .side { padding: 18px; display: grid; gap: 18px; }
  .side-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .side-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.45rem; }
  .side-head .sub { color: var(--muted); font-size: .9rem; }
  .side-head .hol-tag { color: var(--sun); font-size: .85rem; font-weight: 600; }
  .sec-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
  .sec-title h3 { margin: 0; font-size: .78rem; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .add-btn {
    border: 0; background: var(--accent); color: var(--paper); font-weight: 600; font-size: .85rem;
    padding: 6px 12px; border-radius: 8px;
  }
  .add-btn:hover { filter: brightness(1.08); }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .ev {
    display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start;
    padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: none; text-align: left; width: 100%;
    border-left: 4px solid var(--c);
  }
  .ev:hover { background: var(--accent-soft); }
  .ev .t { font-family: var(--font-num); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .ev .title { font-weight: 600; overflow-wrap: anywhere; }
  .ev .meta { font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
  .todo { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px dashed var(--line); }
  .todo:last-child { border-bottom: 0; }
  .todo input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .todo .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .todo.done .txt { text-decoration: line-through; color: var(--muted); }
  .todo .from { font-size: .72rem; color: var(--sun); margin-left: 6px; white-space: nowrap; }
  .todo .x { border: 0; background: none; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .todo .x:hover { color: var(--danger); background: var(--accent-soft); }
  .quick { display: flex; gap: 6px; margin-top: 8px; }
  .quick input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); }
  .empty { color: var(--muted); font-size: .88rem; padding: 6px 2px; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  .ev.school { grid-template-columns: 64px minmax(0, 1fr); cursor: default; }
  .ev.school:hover { background: none; }
  .ev.school .t { color: var(--c); font-family: var(--font-body); font-weight: 600; font-size: .78rem; }
  .chip.sc { background: var(--c); color: var(--paper); border-left-color: var(--c); }
  .legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); font-weight: 500; }
  .legend label input { accent-color: var(--school); width: 15px; height: 15px; margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); padding: 10px 16px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend { flex-direction: column; gap: 6px; }
  .lg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .lg-row b { color: var(--ink); font-weight: 600; min-width: 3.5em; }
  .legend i { width: 12px; height: 9px; border-radius: 2px; background: var(--c); }
  .legend i.soft { background: color-mix(in srgb, var(--c) 18%, transparent); border-left: 3px solid var(--c); }
  .lg-row .tip { margin-left: auto; }

  /* 입력 창 */
  dialog {
    border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--paper); color: var(--ink);
    width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgb(0 0 0 / .25);
  }
  dialog::backdrop { background: rgb(15 20 26 / .45); }
  form.ed { padding: 20px; display: grid; gap: 12px; }
  form.ed h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.3rem; }
  .field { display: grid; gap: 4px; }
  .field label, .lbl { font-size: .78rem; font-weight: 600; color: var(--muted); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); width: 100%; min-width: 0;
  }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 420px) { .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .row .field:first-child { grid-column: 1 / -1; } }
  .hint { font-weight: 400; color: var(--muted); }
  .end-row { display: flex; gap: 6px; }
  .end-row input { flex: 1; }
  .end-row .ghost { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 0 12px; white-space: nowrap; font-size: .85rem; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .cats label { cursor: pointer; }
  .cats input { position: absolute; opacity: 0; pointer-events: none; }
  .cats span {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px;
    border: 1px solid var(--line); font-size: .85rem;
  }
  .cats span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .cats input:checked + span { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); font-weight: 600; }
  .cats input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; flex-wrap: wrap; }
  .actions .del { margin-right: auto; border: 1px solid var(--line); background: none; color: var(--danger); border-radius: 8px; padding: 8px 12px; }
  .actions .del.armed { background: var(--danger); color: var(--paper); border-color: var(--danger); }
  .actions .ghost { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 14px; }
  .actions .primary { border: 0; background: var(--accent); color: var(--paper); border-radius: 8px; padding: 8px 18px; font-weight: 600; }
  .err { color: var(--danger); font-size: .82rem; min-height: 1em; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>하루 플래너</h1>
    <span class="sync" id="sync">이 기기에 저장 중</span>
    <span class="today-line" id="todayLine"></span>
  </header>

  <div class="layout">
    <section class="card">
      <div class="cal">
        <div class="cal-head">
          <h2 id="monthTitle"></h2>
          <button class="icon-btn" id="prev" aria-label="이전 달">‹</button>
          <button class="icon-btn" id="goToday">오늘</button>
          <button class="icon-btn" id="next" aria-label="다음 달">›</button>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="days"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div style="height:14px"></div>
    </section>

    <aside class="card side">
      <div class="side-head">
        <h2 id="selTitle"></h2>
        <span class="sub" id="selSub"></span>
        <span class="hol-tag" id="selHol"></span>
      </div>

      <section>
        <div class="sec-title"><h3>일정</h3><button class="add-btn" id="addEvent">+ 일정 추가</button></div>
        <ul class="list" id="events"></ul>
      </section>

      <section>
        <div class="sec-title"><h3>할 일</h3><span class="sub" id="todoCount"></span></div>
        <div class="progress"><i id="bar"></i></div>
        <ul class="list" id="todos" style="gap:0"></ul>
        <form class="quick" id="quick">
          <input id="quickInput" placeholder="할 일을 적고 Enter" autocomplete="off" maxlength="120">
          <button class="add-btn" type="submit">추가</button>
        </form>
      </section>
    </aside>
  </div>
</div>

<dialog id="dlg">
  <form class="ed" id="edForm" method="dialog">
    <h2 id="edTitle">일정 추가</h2>
    <div class="field"><label for="fTitle">제목</label><input id="fTitle" maxlength="80" placeholder="예: 팀 회의" required></div>
    <div class="row">
      <div class="field"><label for="fDate">날짜</label><input id="fDate" type="date" required></div>
      <div class="field"><label for="fStart">시작 시간</label><input id="fStart" type="time"></div>
      <div class="field"><label for="fEnd">끝 시간</label><input id="fEnd" type="time"></div>
    </div>
    <div class="field">
      <label for="fEndDate">끝나는 날 <span class="hint">여러 날 이어지는 일정이면 고르세요</span></label>
      <div class="end-row"><input id="fEndDate" type="date"><button type="button" class="ghost" id="fEndClear">하루만</button></div>
    </div>
    <div class="field"><span class="lbl">분류</span><div class="cats" id="fCats"></div></div>
    <div class="field">
      <label for="fRepeat">반복</label>
      <select id="fRepeat">
        <option value="none">반복 안 함</option>
        <option value="daily">매일</option>
        <option value="weekly">매주 같은 요일</option>
        <option value="monthly">매월 같은 날</option>
        <option value="yearly">매년 (생일·기념일)</option>
      </select>
    </div>
    <div class="field"><label for="fMemo">메모</label><textarea id="fMemo" rows="2" maxlength="500" placeholder="장소, 준비물 등"></textarea></div>
    <div class="err" id="edErr"></div>
    <div class="actions">
      <button type="button" class="del" id="edDel" hidden>삭제</button>
      <button type="button" class="ghost" id="edCancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<script src="susi-data.js"></script>

    ["2026-12-11", "기말고사(1,2) 5일", "exam"],
    ["2026-12-21", "목요일 수업 운영", "event"],
    ["2026-12-22", "금요일 수업 운영", "event"],
    ["2026-12-29", "목요일 수업 운영", "event"],
    ["2026-12-30", "금요일 수업 운영", "event"],

    ["2027-01-07", "사회 정서 교육(4)", "event"],
    ["2027-01-08", "졸업식(1)", "event"],
    ["2027-01-08", "종업식(1)", "event"],
    ["2027-01-14", "문제 해결 프로그래밍 챌린지", "event"],
    ["2027-01-15", "문제 해결 프로그래밍 챌린지", "event"],
  ];
  // 3학년 수시 일정은 개인정보라 저장소에 두지 않고 susi-data.js(플래너와 함께 게시)에서 읽는다. 없으면 빈 목록.
  const SUSI = window.SUSI_DATA || [];
  const SCHOOL_TYPE = {
    event: { name: "학교", v: "--school" },
    exam: { name: "시험", v: "--exam" },
    off: { name: "쉬는 날", v: "--off" },
    susi: { name: "수시", v: "--susi" },
    ann: { name: "발표", v: "--ann" },
  };
  const SHOW_KEY = "haru-planner-show-school";
  let showSchool = true;
  try { showSchool = localStorage.getItem(SHOW_KEY) !== "0"; } catch {}
  const SUSI_KEY = "haru-planner-show-susi";
  let showSusi = true;
  try { showSusi = localStorage.getItem(SUSI_KEY) !== "0"; } catch {}
  const schoolOn = k => [
    ...(showSchool ? SCHOOL.filter(x => x[0] === k) : []),
    ...(showSusi ? SUSI.filter(x => x[0] === k) : []),
  ];

  const DOW = ["일", "월", "화", "수", "목", "금", "토"];

  const pad = n => String(n).padStart(2, "0");
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => key(new Date());
  const $ = id => document.getElementById(id);

  // ---------- 저장소: 계정(db)이 있으면 계정에, 없으면 이 기기(localStorage)에 ----------
  const LS = "haru-planner-items";
  let items = [];
  let remote = null; // { col }

  function loadLocal() {
    try { items = JSON.parse(localStorage.getItem(LS) || "[]"); } catch { items = []; }
  }
  function saveLocal() {
    try { localStorage.setItem(LS, JSON.stringify(items)); } catch {}
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  async function putItem(it) {
    const i = items.findIndex(x => x.id === it.id);
    if (i >= 0) items[i] = it; else items.push(it);
    render();
    if (remote) {
      try { await remote.col.doc(it.id).set(it); } catch (e) { showSync("저장 실패: 잠시 후 다시 시도하세요"); }
    } else saveLocal();
  }
  async function removeItem(id) {
    items = items.filter(x => x.id !== id);
    render();
    if (remote) {
      try { await remote.col.doc(id).delete(); } catch (e) { showSync("삭제 실패: 잠시 후 다시 시도하세요"); }
    } else saveLocal();
  }
  function showSync(t) { $("sync").textContent = t; }

  async function connect() {
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const uid = db && user ? await user.id() : null;
      if (!db || !uid) return;
      const col = db.collection("data/users/" + uid);
      remote = { col };
      showSync("계정에 저장 중 · 어느 기기에서나 보여요");
      col.limit(1000).onSnapshot(snap => {
        items = snap.docs.map(d => d.data()).filter(Boolean);
        render();
      }, () => { remote = null; loadLocal(); showSync("이 기기에 저장 중"); render(); });
    } catch { /* 이 기기 저장으로 계속 */ }
  }

  // ---------- 일정 반복 계산 ----------
  const isSpan = ev => !!ev.endDate && ev.endDate > ev.date;
  function occursOn(ev, k) {
    if (isSpan(ev)) return k >= ev.date && k <= ev.endDate;
    if (ev.date === k) return true;
    if (!ev.repeat || ev.repeat === "none" || k < ev.date) return false;
    const a = parse(ev.date), b = parse(k);
    switch (ev.repeat) {
      case "daily": return true;
      case "weekly": return a.getDay() === b.getDay();
      case "monthly": return a.getDate() === b.getDate();
      case "yearly": return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
    }
    return false;
  }
  const eventsOn = k => items.filter(x => x.kind === "event" && occursOn(x, k))
    .sort((a, b) => (a.start || "99").localeCompare(b.start || "99"));
  const todosOn = k => items.filter(x => x.kind === "todo" && x.date === k)
    .sort((a, b) => (a.done - b.done) || (a.createdAt - b.createdAt));
  // 오늘 화면에는 지난날 끝내지 못한 할 일도 함께 보여 준다
  const overdue = () => items.filter(x => x.kind === "todo" && !x.done && x.date < todayKey())
    .sort((a, b) => a.date.localeCompare(b.date));

  // ---------- 화면 ----------
  let view = new Date(); view.setDate(1);
  let sel = todayKey();

  function render() { renderCal(); renderSide(); }

  function renderCal() {
    const y = view.getFullYear(), m = view.getMonth();
    $("monthTitle").innerHTML = `<span class="num">${y}</span>년 <span class="num">${m + 1}</span>월`;
    const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    const weeks = Math.ceil((new Date(y, m, 1).getDay() + new Date(y, m + 1, 0).getDate()) / 7);
    const box = $("days"); box.textContent = "";
    const tk = todayKey();
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = key(d);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "day";
      if (d.getMonth() !== m) b.classList.add("other");
      if (d.getDay() === 0) b.classList.add("sun");
      if (d.getDay() === 6) b.classList.add("sat");
      if (HOLIDAYS[k]) b.classList.add("hol");
      if (k === tk) b.classList.add("today");
      if (k === sel) b.classList.add("sel");
      const evs = eventsOn(k), tds = todosOn(k), sch = schoolOn(k);
      b.setAttribute("aria-label", `${d.getMonth() + 1}월 ${d.getDate()}일, 학교 ${sch.length}개, 일정 ${evs.length}개, 할 일 ${tds.length}개`);
      const n = document.createElement("span"); n.className = "dnum"; n.textContent = d.getDate(); b.append(n);
      if (HOLIDAYS[k]) { const h = document.createElement("span"); h.className = "hol-name"; h.textContent = HOLIDAYS[k]; b.append(h); }
      let show = HOLIDAYS[k] ? 1 : 2;
      sch.slice(0, show).forEach(([, t, ty]) => {
        const c = document.createElement("span"); c.className = "chip sc"; c.style.setProperty("--c", `var(${SCHOOL_TYPE[ty].v})`);
        c.textContent = t; b.append(c);
      });
      const schHidden = Math.max(0, sch.length - show);
      show = Math.max(0, show - sch.length);
      evs.slice(0, show).forEach(ev => {
        const c = document.createElement("span"); c.className = "chip"; c.style.setProperty("--c", catColor(ev.cat));
        c.textContent = (isSpan(ev) && k > ev.date ? "↳ " : ev.start ? ev.start + " " : "") + ev.title; b.append(c);
      });
      const hidden = schHidden + Math.max(0, evs.length - show);
      if (hidden) { const mo = document.createElement("span"); mo.className = "more"; mo.textContent = `+${hidden}개`; b.append(mo); }
      const dots = document.createElement("span"); dots.className = "dots";
      sch.slice(0, 2).forEach(([, , ty]) => { const i2 = document.createElement("i"); i2.style.setProperty("--c", `var(${SCHOOL_TYPE[ty].v})`); dots.append(i2); });
      evs.slice(0, 4).forEach(ev => { const i2 = document.createElement("i"); i2.style.setProperty("--c", catColor(ev.cat)); dots.append(i2); });
      if (tds.some(t => !t.done)) { const i2 = document.createElement("i"); i2.style.setProperty("--c", "var(--muted)"); dots.append(i2); }
      b.append(dots);
      b.addEventListener("click", () => { sel = k; if (d.getMonth() !== m) { view = new Date(d.getFullYear(), d.getMonth(), 1); } render(); });
      b.addEventListener("dblclick", () => openEditor(null, k));
      box.append(b);
    }
  }

  function renderSide() {
    const d = parse(sel), tk = todayKey();
    $("selTitle").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
    const diff = Math.round((d - parse(tk)) / 864e5);
    $("selSub").textContent = diff === 0 ? "오늘" : diff === 1 ? "내일" : diff === -1 ? "어제" : diff > 0 ? `D-${diff}` : `${-diff}일 전`;
    $("selHol").textContent = HOLIDAYS[sel] || "";

    const ul = $("events"); ul.textContent = "";
    const evs = eventsOn(sel);
    const sch = schoolOn(sel);
    sch.forEach(([, t, ty]) => {
      const li = document.createElement("li");
      const box = document.createElement("div"); box.className = "ev school";
      box.style.setProperty("--c", `var(${SCHOOL_TYPE[ty].v})`);
      const tg = document.createElement("span"); tg.className = "t"; tg.textContent = SCHOOL_TYPE[ty].name;
      const ti = document.createElement("div"); ti.className = "title"; ti.textContent = t;
      box.append(tg, ti); li.append(box); ul.append(li);
    });
    if (!evs.length && !sch.length) ul.innerHTML = `<li class="empty">일정이 없어요. ‘+ 일정 추가’를 누르거나 달력의 날짜를 두 번 누르세요.</li>`;
    evs.forEach(ev => {
      const li = document.createElement("li");
      const b = document.createElement("button"); b.className = "ev"; b.type = "button";
      b.style.setProperty("--c", catColor(ev.cat));
      const t = document.createElement("span"); t.className = "t";
      const md = s => { const x = parse(s); return `${x.getMonth() + 1}/${x.getDate()}`; };
      t.textContent = isSpan(ev) ? `${md(ev.date)}~\n${md(ev.endDate)}`
        : ev.start ? ev.start + (ev.end ? "\n~" + ev.end : "") : "하루 종일";
      t.style.whiteSpace = "pre";
      const body = document.createElement("span");
      const ti = document.createElement("div"); ti.className = "title"; ti.textContent = ev.title;
      const meta = document.createElement("div"); meta.className = "meta";
      const rep = { daily: "매일", weekly: "매주", monthly: "매월", yearly: "매년" }[ev.repeat];
      const span = isSpan(ev) && (() => {
        const total = Math.round((parse(ev.endDate) - parse(ev.date)) / 864e5) + 1;
        const nth = Math.round((parse(sel) - parse(ev.date)) / 864e5) + 1;
        const tm = [ev.start && `${md(ev.date)} ${ev.start} 시작`, ev.end && `${md(ev.endDate)} ${ev.end} 끝`].filter(Boolean).join(", ");
        return `${total}일 중 ${nth}일째` + (tm ? ` (${tm})` : "");
      })();
      meta.textContent = [(CATS.find(c => c.id === ev.cat) || CATS[0]).name, span, rep && `${rep} 반복`, ev.memo].filter(Boolean).join(" · ");
      body.append(ti, meta); b.append(t, body);
      b.addEventListener("click", () => openEditor(ev));
      li.append(b); ul.append(li);
    });

    const tl = $("todos"); tl.textContent = "";
    const own = todosOn(sel);
    const late = sel === tk ? overdue() : [];
    const all = [...late, ...own];
    if (!all.length) tl.innerHTML = `<li class="empty">할 일이 없어요. 아래 칸에 적고 Enter를 누르세요.</li>`;
    all.forEach(td => {
      const li = document.createElement("li"); li.className = "todo" + (td.done ? " done" : "");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!td.done; cb.id = "td-" + td.id;
      cb.addEventListener("change", () => putItem({ ...td, done: cb.checked }));
      const lab = document.createElement("label"); lab.className = "txt"; lab.htmlFor = cb.id; lab.textContent = td.title;
      if (td.date < sel) { const f = document.createElement("span"); f.className = "from"; const fd = parse(td.date); f.textContent = `${fd.getMonth() + 1}/${fd.getDate()}부터 밀림`; lab.append(f); }
      const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "할 일 삭제");
      x.addEventListener("click", () => removeItem(td.id));
      li.append(cb, lab, x); tl.append(li);
    });
    const done = own.filter(t => t.done).length;
    $("todoCount").textContent = own.length ? `${done} / ${own.length} 완료` : "";
    $("bar").style.width = own.length ? (done / own.length * 100) + "%" : "0";
  }

  // ---------- 일정 입력 창 ----------
  let editing = null;
  const dlg = $("dlg");
  $("fCats").innerHTML = CATS.map((c, i) =>
    `<label style="--c:var(${c.v})"><input type="radio" name="cat" id="cat-${c.id}" value="${c.id}"${i ? "" : " checked"}><span>${c.name}</span></label>`).join("");

  function openEditor(ev, date) {
    editing = ev;
    $("edTitle").textContent = ev ? "일정 고치기" : "일정 추가";
    $("fTitle").value = ev?.title || "";
    $("fDate").value = ev?.date || date || sel;
    $("fEndDate").value = ev?.endDate || "";
    $("fStart").value = ev?.start || "";
    $("fEnd").value = ev?.end || "";
    $("fRepeat").value = ev?.repeat || "none";
    $("fMemo").value = ev?.memo || "";
    $("cat-" + (ev?.cat || "work")).checked = true;
    $("edErr").textContent = "";
    $("edDel").hidden = !ev; $("edDel").classList.remove("armed"); $("edDel").textContent = "삭제";
    dlg.showModal();
    $("fTitle").focus();
  }
  $("edCancel").addEventListener("click", () => dlg.close());
  $("fEndClear").addEventListener("click", () => { $("fEndDate").value = ""; });
  $("edDel").addEventListener("click", e => {
    const b = e.currentTarget;
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = editing?.repeat && editing.repeat !== "none" ? "반복 일정 모두 삭제" : "한 번 더 누르면 삭제"; return; }
    removeItem(editing.id); dlg.close();
  });
  $("edForm").addEventListener("submit", e => {
    e.preventDefault();
    const title = $("fTitle").value.trim(), date = $("fDate").value;
    const start = $("fStart").value, end = $("fEnd").value;
    if (!title) { $("edErr").textContent = "제목을 적어 주세요."; return; }
    if (!date) { $("edErr").textContent = "날짜를 골라 주세요."; return; }
    const endDate = $("fEndDate").value > date ? $("fEndDate").value : "";
    if ($("fEndDate").value && $("fEndDate").value < date) { $("edErr").textContent = "끝나는 날이 시작 날짜보다 빨라요."; return; }
    if (endDate && $("fRepeat").value !== "none") { $("edErr").textContent = "여러 날 이어지는 일정은 반복할 수 없어요. 반복을 ‘반복 안 함’으로 바꿔 주세요."; return; }
    if (!endDate && start && end && end < start) { $("edErr").textContent = "끝나는 시간이 시작 시간보다 빨라요."; return; }
    putItem({
      id: editing?.id || newId(), kind: "event", title, date, endDate, start, end: start || endDate ? end : "",
      cat: document.querySelector('input[name="cat"]:checked')?.value || "work",
      repeat: $("fRepeat").value, memo: $("fMemo").value.trim(),
      createdAt: editing?.createdAt || Date.now(),
    });
    sel = date; const d = parse(date); view = new Date(d.getFullYear(), d.getMonth(), 1);
    dlg.close();
  });

  $("addEvent").addEventListener("click", () => openEditor(null, sel));
  $("quick").addEventListener("submit", e => {
    e.preventDefault();
    const t = $("quickInput").value.trim();
    if (!t) return;
    putItem({ id: newId(), kind: "todo", title: t, date: sel, done: false, createdAt: Date.now() });
    $("quickInput").value = "";
  });
  $("prev").addEventListener("click", () => { view.setMonth(view.getMonth() - 1); renderCal(); });
  $("next").addEventListener("click", () => { view.setMonth(view.getMonth() + 1); renderCal(); });
  $("goToday").addEventListener("click", () => { view = new Date(); view.setDate(1); sel = todayKey(); render(); });

  $("dows").innerHTML = DOW.map((d, i) => `<div class="dow${i === 0 ? " sun" : i === 6 ? " sat" : ""}">${d}</div>`).join("");
  const swatch = (c, solid) => `<span><i class="${solid ? "solid" : "soft"}" style="--c:var(${c.v})"></i>${c.name}</span>`;
  $("legend").innerHTML =
    `<div class="lg-row"><b>학교</b>`
    + `<label><input type="checkbox" id="showSchool"${showSchool ? " checked" : ""}>학사일정</label>`
    + (SUSI.length ? `<label><input type="checkbox" id="showSusi"${showSusi ? " checked" : ""}>수시</label>` : "")
    + Object.entries(SCHOOL_TYPE).filter(([id]) => SUSI.length || (id !== "susi" && id !== "ann")).map(([, c]) => swatch(c, true)).join("")
    + `</div><div class="lg-row"><b>내 일정</b>` + CATS.map(c => swatch(c, false)).join("")
    + `<span class="tip">날짜를 두 번 누르면 바로 일정 추가</span></div>`;
  $("showSchool").addEventListener("change", e => {
    showSchool = e.target.checked;
    try { localStorage.setItem(SHOW_KEY, showSchool ? "1" : "0"); } catch {}
    render();
  });
  $("showSusi")?.addEventListener("change", e => {
    showSusi = e.target.checked;
    try { localStorage.setItem(SUSI_KEY, showSusi ? "1" : "0"); } catch {}
    render();
  });
  const now = new Date();
  $("todayLine").textContent = `오늘 ${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${DOW[now.getDay()]}`;

  loadLocal();
  render();
  connect();
})();
</script>
